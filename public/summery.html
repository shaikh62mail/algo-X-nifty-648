<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Major Stock Moves | NIFTY Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a0f;--surface:#0a1320;--surface2:#0f1e30;--border:#1a3050;--accent:#00d4ff;--green:#00ff88;--red:#ff3355;--yellow:#ffd700;--text:#e0f0ff;--muted:#6687a3;--mono:'Share Tech Mono',monospace;--display:'Barlow Condensed',sans-serif;--body:'Rajdhani',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:var(--bg);background-image:radial-gradient(ellipse at 15% 0%,rgba(0,100,180,.1),transparent 48%),radial-gradient(ellipse at 90% 100%,rgba(0,212,255,.05),transparent 45%);color:var(--text);font-family:var(--body)}.page{max-width:1500px;margin:auto;padding:22px 20px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand{font:900 25px var(--display);letter-spacing:4px;color:var(--accent)}.brand small{display:block;font:9px var(--mono);color:var(--muted);letter-spacing:3px;margin-top:-2px}.actions{display:flex;gap:8px}.btn{display:inline-block;padding:9px 16px;border:0;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);background:linear-gradient(135deg,#24516d,#00a8c7);color:#fff;cursor:pointer;font:700 12px var(--display);letter-spacing:2px;text-decoration:none}.glass{background:linear-gradient(135deg,rgba(10,19,32,.96),rgba(15,30,48,.78));border:1px solid var(--border)}.panel{padding:16px}.message{font:12px var(--mono);color:var(--muted);margin-top:8px}.title{font:700 12px var(--display);letter-spacing:4px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}.title:before{content:'';width:3px;height:14px;background:var(--accent)}.title:after{content:'';height:1px;background:var(--border);flex:1}.status{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:10px;margin-top:16px}.status-item{padding:12px;background:rgba(0,0,0,.25);border-left:3px solid var(--accent)}.status-label{display:block;font:9px var(--mono);letter-spacing:2px;color:var(--muted);margin-bottom:7px}.status-value{font:20px var(--mono);color:var(--text)}.bullish{color:var(--green)}.bearish{color:var(--red)}.neutral{color:var(--yellow)}.boards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.board{padding:16px}.board-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:4px}.board-title{font:900 22px var(--display);letter-spacing:3px}.board-note{font:10px var(--mono);color:var(--muted)}.stock{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid rgba(26,48,80,.6)}.stock:last-child{border-bottom:0}.stock-name{font:700 17px var(--display);letter-spacing:1px}.stock-meta{display:block;font:10px var(--mono);color:var(--muted);margin-top:2px}.stock-price{font:12px var(--mono);color:var(--text)}.move{font:700 17px var(--mono);min-width:90px;text-align:right}.empty{padding:40px 8px;text-align:center;color:var(--muted);font:12px var(--mono);letter-spacing:1px}.error{color:var(--red)}@media(max-width:760px){.page{padding:14px 10px}.topbar{align-items:flex-start;flex-direction:column}.status{grid-template-columns:repeat(2,minmax(0,1fr))}.boards{grid-template-columns:1fr}.stock{grid-template-columns:1fr auto}.stock-price{display:none}.move{grid-column:2;grid-row:1}.brand{font-size:22px}}
 .page{padding-top:30px}.topbar{padding:14px 16px;border:1px solid rgba(0,212,255,.16);background:rgba(5,12,22,.72);box-shadow:0 16px 40px rgba(0,0,0,.22)}.brand{line-height:.9;text-shadow:0 0 22px rgba(0,212,255,.3)}.brand small{margin-top:8px;letter-spacing:2px}.actions{align-items:center}.btn{display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:11px 16px;background:linear-gradient(135deg,#0a7797,#00c3df);box-shadow:0 8px 20px rgba(0,180,220,.18);transition:transform .2s ease,box-shadow .2s ease,filter .2s ease}.btn:before{content:'>';display:grid;place-items:center;width:18px;height:18px;border:1px solid rgba(255,255,255,.55);border-radius:50%;font:700 12px var(--mono)}.btn:hover{filter:brightness(1.12);transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,212,255,.3)}.glass{box-shadow:0 18px 45px rgba(0,0,0,.16);border-color:rgba(61,112,150,.42)}.panel{padding:20px}.message{display:flex;align-items:center;gap:8px;color:#8ea9bd}.message:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}.status{gap:12px}.status-item{padding:15px 14px;border-left:0;border-top:2px solid var(--accent);border-radius:4px;background:linear-gradient(145deg,rgba(18,39,60,.7),rgba(3,10,18,.55));box-shadow:inset 0 1px rgba(255,255,255,.04)}.status-item:nth-child(2){border-top-color:var(--green)}.status-item:nth-child(3){border-top-color:var(--red)}.status-item:nth-child(4){border-top-color:var(--yellow)}.status-value{font-size:24px}.boards{gap:18px}.board{padding:20px;border-radius:4px}.board:first-child{border-top:2px solid var(--green)}.board:last-child{border-top:2px solid var(--red)}.board-head{padding-bottom:14px;margin-bottom:2px}.board-title{font-size:24px}.board-note{padding:4px 7px;border:1px solid var(--border);border-radius:3px;letter-spacing:1px}.stock{position:relative;padding:15px 8px;border-bottom-color:rgba(82,125,157,.2);transition:background .18s ease,transform .18s ease}.stock:before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:2px;background:currentColor;opacity:.35}.stock:hover{background:rgba(75,130,165,.1);transform:translateX(3px)}.stock-name{font-size:19px}.stock-meta{margin-top:4px}.stock-price{color:#afc4d5}.move{font-size:18px}.empty{padding:48px 8px;border:1px dashed rgba(102,135,163,.3);margin-top:12px;border-radius:4px}
@media (max-width:760px){
  html{-webkit-text-size-adjust:100%}
  .page{padding:12px 10px 24px}
  .topbar{padding:14px 12px;gap:14px;margin-bottom:12px}
  .brand{font-size:22px;letter-spacing:2px;max-width:100%;overflow-wrap:anywhere}
  .brand small{font-size:8px;letter-spacing:1.5px;line-height:1.4}
  .actions,.btn{width:100%}
  .btn{justify-content:center;padding:11px 14px}
  .panel{padding:14px}
  .title{font-size:10px;letter-spacing:2px}
  .message{font-size:10px;line-height:1.5;align-items:flex-start}
  .status{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
  .status-item{padding:12px 10px}
  .status-value{font-size:20px}
  .status-label{font-size:8px;letter-spacing:1px}
  .boards{grid-template-columns:1fr;gap:12px;margin-top:12px}
  .board{padding:14px}
  .board-head{align-items:center;padding-bottom:10px}
  .board-title{font-size:21px;letter-spacing:2px}
  .board-note{font-size:8px;padding:4px 6px}
  .stock{grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:13px 6px}
  .stock-name{font-size:17px;line-height:1.05;overflow-wrap:anywhere}
  .stock-meta{font-size:8px;line-height:1.35;overflow-wrap:anywhere}
  .stock-price{display:none}
  .move{grid-column:2;grid-row:1;font-size:16px;min-width:74px}
  .empty{padding:32px 8px;font-size:10px;line-height:1.5}
}
</style>
</head>
<body>
<main class="page">
  <header class="topbar"><div class="brand">MAJOR STOCK MOVES<small>NIFTY 50 BULLISH / BEARISH LEADERS</small></div><div class="actions"><a class="btn" href="/index.html">DASHBOARD</a></div></header>
  <section class="glass panel">
    <div class="title">High-Move Market Snapshot</div>
    <div class="message" id="message">Loading major stock movements...</div>
    <div class="status">
      <div class="status-item"><span class="status-label">QUALIFYING MOVES</span><span class="status-value" id="total">0</span></div>
      <div class="status-item"><span class="status-label">BULLISH</span><span class="status-value bullish" id="bullishCount">0</span></div>
      <div class="status-item"><span class="status-label">BEARISH</span><span class="status-value bearish" id="bearishCount">0</span></div>
      <div class="status-item"><span class="status-label">THRESHOLD</span><span class="status-value neutral" id="threshold">0.50%</span></div>
    </div>
  </section>
  <section class="boards">
    <article class="glass board"><div class="board-head"><h2 class="board-title bullish">TOP BULLISH</h2><span class="board-note">DAY MOVE</span></div><div id="bullishList"><div class="empty">Loading...</div></div></article>
    <article class="glass board"><div class="board-head"><h2 class="board-title bearish">TOP BEARISH</h2><span class="board-note">DAY MOVE</span></div><div id="bearishList"><div class="empty">Loading...</div></div></article>
  </section>
</main>
<script>
const MOVE_THRESHOLD=0.5;
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const number=value=>Number(value)||0;
function stockMove(stock){return number(stock.dayReturnPct??stock.returnPct)}
function stockRow(stock,direction){const move=stockMove(stock);const sign=move>=0?'+':'';return `<div class="stock"><div><span class="stock-name">${escapeHtml(stock.ticker)}</span><span class="stock-meta">Weight ${number(stock.weight).toFixed(2)}% | ${escapeHtml(stock.symbol||'')}</span></div><span class="stock-price">Rs ${number(stock.price).toFixed(2)}</span><span class="move ${direction}">${sign}${move.toFixed(2)}%</span></div>`}
function render(signal){const stocks=Array.isArray(signal?.stocks)?signal.stocks:[];const movers=stocks.map(stock=>({...stock,move:stockMove(stock)})).filter(stock=>Math.abs(stock.move)>=MOVE_THRESHOLD);const bullish=movers.filter(stock=>stock.move>0).sort((a,b)=>b.move-a.move).slice(0,10);const bearish=movers.filter(stock=>stock.move<0).sort((a,b)=>a.move-b.move).slice(0,10);document.getElementById('total').textContent=movers.length;document.getElementById('bullishCount').textContent=bullish.length;document.getElementById('bearishCount').textContent=bearish.length;document.getElementById('message').textContent=signal?.capturedAt?`Updated ${new Date(signal.capturedAt).toLocaleTimeString()} | Only moves of ${MOVE_THRESHOLD.toFixed(2)}% or more are shown.`:'Waiting for market data...';document.getElementById('bullishList').innerHTML=bullish.length?bullish.map(stock=>stockRow(stock,'bullish')).join(''):'<div class="empty">No major bullish move above threshold.</div>';document.getElementById('bearishList').innerHTML=bearish.length?bearish.map(stock=>stockRow(stock,'bearish')).join(''):'<div class="empty">No major bearish move above threshold.</div>'}
async function load(){try{const response=await fetch('/api/market-pulse',{cache:'no-store'});const data=await response.json();if(!data.success)throw new Error(data.message||'Unable to load');render(data.marketPulse?.constituentSignal)}catch(error){document.getElementById('message').textContent='Major stock data unavailable. Start the dashboard first.';document.getElementById('message').classList.add('error')}}
load();setInterval(load,5000);
</script>
</body>
</html>
